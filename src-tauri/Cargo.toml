[package]
name = "az-term"
version = "0.6.0"
description = "Az-term：SSH / SFTP / 终端，免费无账号不过期"
authors = ["Azi36"]
edition = "2021"

[lib]
name = "az_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

# —— SSH / SFTP 引擎 ——
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"

# known_hosts 里哈希过的条目（|1|salt|hash）要自己认，跟 OpenSSH 一套算法
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

# 终端和文本文件的字符编码：老服务器上大把 GBK，硬按 UTF-8 读就是一屏乱码
encoding_rs = "0.8"

# 选文件 / 选保存位置：私钥路径、配置导出导入都要用系统对话框
tauri-plugin-dialog = "2"

# 装完更新之后自己重启
tauri-plugin-process = "2"

# 后续：suppaftp（FTP）

# —— 凭据保存：交给系统钥匙串，明文一个字节都不落我们自己的盘 ——
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# —— 自动更新：只有桌面版需要 ——
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"
