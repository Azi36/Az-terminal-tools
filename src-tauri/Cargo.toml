[package]
name = "az-term"
version = "0.9.0"
description = "Az-term：SSH / SFTP / 终端，免费无账号不过期"
authors = ["Azi36"]
edition = "2021"

[lib]
name = "az_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }

# —— SSH / SFTP 引擎 ——
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
async-trait = "0.1"

# known_hosts 里哈希过的条目（|1|salt|hash）要自己认，跟 OpenSSH 一套算法
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

# —— 加密导出：备份文件里没有密码，但主机名 / 用户名 / 内网拓扑本身就是情报 ——
# Argon2id 扛暴力猜口令，XChaCha20-Poly1305 负责实际加解密并带完整性校验。
# 只是把成熟原语按标准用法组装，不自己发明算法。
argon2 = "0.5"
chacha20poly1305 = "0.10"

# 终端和文本文件的字符编码：老服务器上大把 GBK，硬按 UTF-8 读就是一屏乱码
encoding_rs = "0.8"

# —— WebDAV 同步：只做 PUT / GET 两个请求，用不着整套 HTTP 客户端 ——
# ureq 是阻塞式的、自带 rustls，依赖树比 reqwest 小一大截；调用处放 spawn_blocking。
ureq = "2"

# 选文件 / 选保存位置：私钥路径、配置导出导入都要用系统对话框
tauri-plugin-dialog = "2"

# 装完更新之后自己重启
tauri-plugin-process = "2"
portable-pty = "0.8"
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
tokio-postgres = "0.7"
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }

# 后续：suppaftp（FTP）

# —— 凭据保存：交给系统钥匙串，明文一个字节都不落我们自己的盘 ——
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }


# —— 全局热键：不在前台也能把窗口叫出来（Quake 模式）——
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

# —— 自动更新：只有桌面版需要 ——
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-updater = "2"
