name: 检查

# 每次推代码和开 PR 都跑一遍，别等到打包那天才发现编译不过。
# 只改官网 / 文档的提交不跑：那些改动碰不到 Rust 和前端源码，
# 白跑三分多钟编译，还多一次撞上 action 下载抽风的机会（2026-08-17 就这么挂过一回）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 只做检查，token 只要读权限
permissions:
  contents: read

jobs:
  check:
    # 两个平台都编：keyring 的后端、cfg(target_os = "macos") 那些分支只在打 tag 时才第一次编译，
    # 光在 Windows 上全绿不算数 —— 出包那天挂在 macOS 上，tag 已经推出去了
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust 缓存
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npx tsc --noEmit

      - name: 前端构建
        run: npm run build

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
