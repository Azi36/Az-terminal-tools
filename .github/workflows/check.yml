name: 检查

# 每次推代码和开 PR 都跑一遍，别等到打包那天才发现编译不过。
# 只改官网 / 文档的提交不跑：那些改动碰不到 Rust 和前端源码，
# 白跑三分多钟编译，还多一次撞上 action 下载抽风的机会（2026-08-17 就这么挂过一回）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npx tsc --noEmit

      - name: 前端构建
        run: npm run build

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Rust 静态检查
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
