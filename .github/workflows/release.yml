name: 出安装包

# 打个 v* 标签就出包；也能在 Actions 页面手动点（那时候得自己填 tag）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要出包的 tag（例如 v0.7.0）"
        required: true

jobs:
  # 先把草稿建出来，把 id 交给下面两个 runner。
  #
  # 为什么不让它们各自「找不到就建」：那两个 job 是并行的，草稿又没有真正的 tag
  # 引用、按 tag 根本查不到，于是两边都以为没有、各建一个草稿。v0.7.0 第一次出包
  # 就是这样，Windows 和 macOS 的产物分在了两个草稿里。
  # 更要命的是 latest.json——它是按「同一个 release 上已有的那份」合并平台的，
  # 分成两份就等于每份只写了一个平台，另一个平台的自动更新直接是坏的。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.make.outputs.result }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: 认哪个 tag
        id: pick
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 正文从 CHANGELOG 里抠。原来这儿写死一句占位符，每次发版都要人工把
      # 对应小节贴进网页 —— 0.8.0 那次贴的是渲染后的文字，markdown 标记全丢了。
      # 抠不到就还用占位符：出包不该因为更新日志没写而失败。
      - name: 取更新日志
        id: notes
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/notes.md"
          if node scripts/release-notes.mjs "$TAG" > "$out" && [ -s "$out" ]; then
            echo "从 CHANGELOG 取到 $TAG 的小节，$(wc -c < "$out") 字节"
          else
            printf 'Windows 装 .msi，macOS 装 .dmg。\n' > "$out"
            echo "::warning::CHANGELOG.md 里没有 $TAG 的小节，正文先用占位符，发布前自己补"
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: 建草稿
        id: make
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        with:
          result-encoding: string
          script: |
            const notes = require('fs').readFileSync(process.env.NOTES_FILE, 'utf8')
            const tag = '${{ steps.pick.outputs.tag }}'
            if (!/^v\d/.test(tag)) {
              core.setFailed(`「${tag}」不像个版本 tag。手动触发时要在输入框里填 v0.7.0 这样的值，` +
                             `否则会建出一个名字是分支名的 Release。`)
              return
            }
            // 同一个 tag 重跑时别再建一个：已有的（草稿也算）直接复用
            const { data: list } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const had = list.find((one) => one.tag_name === tag)
            if (had) {
              core.info(`复用已有的 Release #${had.id}（draft=${had.draft}）`)
              // 重跑时把正文补上，但只在「还是草稿、而且正文还没被人动过」的时候：
              // 已经手改过的正文不能覆盖，那是发版前刚删减完的东西
              const untouched = !had.body?.trim() || had.body.trim() === 'Windows 装 .msi，macOS 装 .dmg。'
              if (had.draft && untouched && notes.trim()) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: had.id,
                  body: notes,
                })
                core.info('顺手把更新日志填进去了')
              }
              return String(had.id)
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              // 展示用的名字跟官网统一成 AzTerm；
              // 安装包里的 productName 没动，那个改了会牵动安装包标识和更新器匹配
              name: `AzTerm ${tag}`,
              body: notes,
              // 草稿：附件齐不齐要人看过才发，Publish 那一下才会惊动用户
              draft: true,
              prerelease: false,
            })
            return String(data.id)

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      # 手动触发时 ref 是分支，得显式检出那个 tag，不然打出来的是 main 的代码
      #
      # 第三方 action 一律 pin 到提交号（注释里是对应的版本）：这个 job 的环境里有更新签名的
      # 私钥，浮动 tag 被上游重指一次就等于把它交出去，之后谁都能给全部用户推更新。
      # 升级时把提交号换掉，别换回 tag。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: 装 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      - name: 打包 + 传到那个草稿上
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # —— 自动更新的签名 ——
          # 这两个是**必需**的，不是可选：tauri.conf.json 里配了 pubkey 且开了
          # createUpdaterArtifacts，打包时找不到私钥会直接报
          # 「A public key has been found, but no private key」然后失败，
          # 不会退而求其次出个没签名的包。
          # 私钥是 `npm run tauri signer generate` 生成的那个 .key 文件的**内容**，
          # 密码是生成时设的那串（这把私钥是加密的，密码不能留空）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # —— macOS 代码签名 ——
          # 这里**故意不写** APPLE_CERTIFICATE 那几个变量。
          # 原来写了，以为"Secret 没配就自动跳过签名"——不对：只要 env 里出现了
          # 这个名字，变量就以空字符串的形式存在，而 Tauri 判断的是"变量在不在"，
          # 于是拿空证书去跑 security import，直接炸：
          #   security: SecKeychainItemImport: One or more parameters ... were not valid
          #   failed codesign application
          # （2026-08-17 v0.6.0 第一次出包就是这么挂的）
          # 以后真买了 Apple 开发者证书，再把这几行加回来：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          # 上一步建好的那个草稿：两个平台都往它上面传，
          # latest.json 才会被合成一份带两个平台的清单
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json 是自动更新用的清单，让 tauri-action 一起传上去
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # 两个 runner 各自往草稿上合并 latest.json：列出已有的 → 下载合并 → 删旧传新。
  # 两边要是在同几秒钟内一起走到这步，后传的看不到先传的，文件在、里面却只剩一个平台。
  # 人工核对附件挡不住这个（文件名都在），所以机器把内容也核一遍；顺手把附件清单也点一遍。
  verify-updater:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 核对 latest.json 和附件
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const release_id = Number('${{ needs.create-release.outputs.release_id }}')
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            })
            const names = assets.map((a) => a.name)
            core.info(`附件：${names.join(', ')}`)
            const want = ['.msi', '.msi.sig', '.dmg', '.app.tar.gz', '.app.tar.gz.sig', 'latest.json']
            const missing = want.filter((suffix) => !names.some((n) => n.endsWith(suffix)))
            if (missing.length) {
              core.setFailed(`附件不齐：缺 ${missing.join(' ')} —— 少 .sig 或 latest.json 说明签名没成，自动更新是坏的，别 Publish`)
              return
            }
            const json = assets.find((a) => a.name === 'latest.json')
            const { data } = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: json.id,
              headers: { accept: 'application/octet-stream' },
            })
            const text = Buffer.from(data).toString('utf8')
            const platforms = Object.keys(JSON.parse(text).platforms || {})
            core.info(`latest.json 平台：${platforms.join(', ')}`)
            const has = (prefix) => platforms.some((k) => k.startsWith(prefix))
            if (!has('windows-') || !has('darwin-')) {
              core.setFailed('latest.json 缺平台 —— 两个 runner 上传时互相覆盖了。到 build 里把晚结束的那个平台重跑一次即可。')
            }
