name: 出安装包

# 打个 v* 标签就出包；也能在 Actions 页面手动点
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 装前端依赖
        run: npm ci

      - name: 打包 + 发 Release 草稿
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # —— 自动更新的签名 ——
          # 这两个是**必需**的，不是可选：tauri.conf.json 里配了 pubkey 且开了
          # createUpdaterArtifacts，打包时找不到私钥会直接报
          # 「A public key has been found, but no private key」然后失败，
          # 不会退而求其次出个没签名的包。
          # 私钥是 `npm run tauri signer generate` 生成的那个 .key 文件的**内容**，
          # 密码是生成时设的那串（这把私钥是加密的，密码不能留空）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # —— macOS 代码签名 ——
          # 这里**故意不写** APPLE_CERTIFICATE 那几个变量。
          # 原来写了，以为"Secret 没配就自动跳过签名"——不对：只要 env 里出现了
          # 这个名字，变量就以空字符串的形式存在，而 Tauri 判断的是"变量在不在"，
          # 于是拿空证书去跑 security import，直接炸：
          #   security: SecKeychainItemImport: One or more parameters ... were not valid
          #   failed codesign application
          # （2026-08-17 v0.6.0 第一次出包就是这么挂的）
          # 以后真买了 Apple 开发者证书，再把这几行加回来：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          # 展示用的名字跟官网统一成 AzTerm；
          # 安装包里的 productName 没动，那个改了会牵动安装包标识和更新器匹配
          releaseName: "AzTerm ${{ github.ref_name }}"
          releaseBody: "Windows 装 .msi，macOS 装 .dmg。"
          releaseDraft: true
          prerelease: false
          # latest.json 是自动更新用的清单，让 tauri-action 一起传上去
          includeUpdaterJson: true
          args: ${{ matrix.args }}
